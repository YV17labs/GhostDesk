; Notification daemon. Dies with "failed to create display" if it starts
; before sway bound its socket, hence the gate.
[program:mako]
command=/usr/local/bin/wait-for-wayland mako
user=%(ENV_GHOSTDESK_USER)s
priority=30
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
